<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Missing Library Finder</title>
  <style>
    :root {
      --bg: var(--figma-color-bg, #ffffff);
      --bg-subtle: var(--figma-color-bg-secondary, #f5f5f5);
      --bg-card: var(--figma-color-bg, #ffffff);
      --bg-hover: var(--figma-color-bg-hover, #f0f0f0);
      --bg-active: var(--figma-color-bg-pressed, #e5e5e5);
      --border: var(--figma-color-border, #e5e5e5);
      --border-subtle: var(--figma-color-border-subtle, #ececec);
      --text: var(--figma-color-text, #111827);
      --text-muted: var(--figma-color-text-secondary, #6b7280);
      --text-dim: var(--figma-color-text-tertiary, #9ca3af);
      --primary: var(--figma-color-bg-brand, #18a0fb);
      --primary-hover: var(--figma-color-bg-brand-hover, #0b69a3);
      --primary-text: #ffffff;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --danger-border: rgba(239, 68, 68, 0.35);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.15);
      --warning-border: rgba(245, 158, 11, 0.35);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --radius-sm: 4px;
      --radius: 6px;
      --radius-lg: 8px;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.15);
      --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: var(--figma-color-bg, #2c2c2c);
        --bg-subtle: var(--figma-color-bg-secondary, #1e1e1e);
        --bg-card: var(--figma-color-bg, #2c2c2c);
        --bg-hover: var(--figma-color-bg-hover, #383838);
        --bg-active: var(--figma-color-bg-pressed, #444444);
        --border: var(--figma-color-border, #444444);
        --border-subtle: var(--figma-color-border-subtle, #383838);
        --text: var(--figma-color-text, #f3f4f6);
        --text-muted: var(--figma-color-text-secondary, #a1a1aa);
        --text-dim: var(--figma-color-text-tertiary, #71717a);
      }
    }

    .figma-dark, [data-fpl-version="theme-dark"] {
      --bg: var(--figma-color-bg, #2c2c2c);
      --bg-subtle: var(--figma-color-bg-secondary, #1e1e1e);
      --bg-card: var(--figma-color-bg, #2c2c2c);
      --bg-hover: var(--figma-color-bg-hover, #383838);
      --bg-active: var(--figma-color-bg-pressed, #444444);
      --border: var(--figma-color-border, #444444);
      --border-subtle: var(--figma-color-border-subtle, #383838);
      --text: var(--figma-color-text, #f3f4f6);
      --text-muted: var(--figma-color-text-secondary, #a1a1aa);
      --text-dim: var(--figma-color-text-tertiary, #71717a);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font);
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-size: 12px;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header */
    header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 24px;
      height: 24px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #18a0fb, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 2px 4px rgba(24, 160, 251, 0.25);
    }

    .brand-title {
      font-weight: 600;
      font-size: 13px;
      letter-spacing: -0.01em;
    }

    .scope-selector {
      display: flex;
      align-items: center;
      background: var(--bg-subtle);
      padding: 2px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      gap: 2px;
    }

    .scope-btn {
      padding: 3px 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .scope-btn.active {
      background: var(--bg);
      color: var(--text);
      box-shadow: var(--shadow-sm);
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Controls Bar (Tabs, Filter) */
    .controls-bar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px 14px 6px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .controls-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .tabs {
      display: flex;
      gap: 4px;
    }

    .tab-btn {
      padding: 4px 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      color: var(--text);
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .tab-badge {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 10px;
      color: var(--text-muted);
    }

    .tab-btn.active .tab-badge {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .filter-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .search-box {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      padding: 5px 26px 5px 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-subtle);
      color: var(--text);
      font-size: 11px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
      background: var(--bg);
    }

    .search-icon {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-clear-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .search-clear-btn:hover {
      background: var(--border);
      color: var(--text);
    }

    .search-clear-btn.visible {
      display: flex;
    }

    /* Settings View */
    .settings-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 2px 0 16px;
    }

    .settings-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .settings-section-header {
      padding: 8px 12px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .setting-row {
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border-subtle);
      transition: background 0.1s ease;
    }

    .setting-row:last-child {
      border-bottom: none;
    }

    .setting-row:hover {
      background: var(--bg-hover);
    }

    .setting-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }

    .setting-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
    }

    .setting-desc {
      font-size: 10px;
      color: var(--text-muted);
      line-height: 1.3;
    }

    /* Modern Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--border);
      border-radius: 18px;
      transition: all 0.2s ease;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      transition: all 0.2s ease;
    }

    input:checked + .slider {
      background-color: var(--primary);
    }

    input:checked + .slider:before {
      transform: translateX(14px);
    }

    .settings-footer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px;
    }

    .btn-reset-settings {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      transition: all 0.15s ease;
    }

    .btn-reset-settings:hover {
      background: var(--bg-hover);
      color: var(--text);
      border-color: #cbd5e1;
    }

    /* Main Scroll Area */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Item Card */
    .item-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      flex-shrink: 0 !important;
      min-height: 48px !important;
      display: flex;
      flex-direction: column;
    }

    .item-card:hover {
      border-color: #cbd5e1;
    }

    .item-header {
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      background: var(--bg);
      min-height: 48px !important;
      box-sizing: border-box;
      width: 100%;
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .swatch {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      flex-shrink: 0;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
    }

    .font-icon-badge {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      color: var(--warning);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .item-info {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .item-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text) !important;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .item-badge-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .type-pill {
      font-size: 9px;
      font-weight: 600;
      padding: 0 4px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .type-pill.fill {
      background: #e0f2fe;
      color: #0284c7;
    }

    .type-pill.stroke {
      background: #f3e8ff;
      color: #9333ea;
    }

    .type-pill.variable {
      background: #fef3c7;
      color: #b45309;
    }

    .type-pill.font {
      background: #fee2e2;
      color: #dc2626;
    }

    .type-pill.text-style {
      background: #fce7f3;
      color: #db2777;
    }

    .layer-count-tag {
      font-size: 10px;
      color: var(--text-muted);
    }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-action {
      width: 24px;
      height: 24px;
      padding: 0;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .btn-action svg,
    .btn-scan svg,
    .btn-break-everything svg,
    .layer-btn svg {
      flex-shrink: 0;
      display: block;
    }

    .btn-action:hover {
      background: var(--bg-hover);
      color: var(--text);
      border-color: #cbd5e1;
    }

    .btn-action.break {
      color: var(--danger);
      background: var(--danger-bg);
      border-color: var(--danger-border);
    }

    .btn-action.break:hover {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
    }

    .btn-action.focus {
      color: var(--text-muted);
    }

    .btn-action.focus:hover {
      background: #0b69a3;
      color: white;
      border-color: #0b69a3;
      box-shadow: none;
    }

    .btn-action.select-all {
      color: var(--text-muted);
    }

    .btn-action.select-all:hover {
      background: #0b69a3;
      color: white;
      border-color: #0b69a3;
      box-shadow: none;
    }

    .toggle-drawer-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      border-radius: var(--radius-sm);
      transition: transform 0.2s ease, color 0.15s ease, background 0.15s ease;
    }

    .toggle-drawer-icon:hover {
      background: var(--bg-hover);
      color: var(--text);
    }

    .item-card.expanded .toggle-drawer-icon {
      transform: rotate(180deg);
    }

    /* Expanded Drawer of Layers */
    .layers-drawer {
      display: none;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-subtle);
      padding: 4px 0;
      max-height: 180px;
      overflow-y: auto;
    }

    .item-card.expanded .layers-drawer {
      display: block;
    }

    .layer-row {
      padding: 5px 10px 5px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      transition: background 0.1s ease;
    }

    .layer-row:hover {
      background: var(--bg-hover);
    }

    .layer-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .layer-type-tag {
      font-size: 9px;
      color: var(--text-dim);
      font-family: monospace;
    }

    .layer-name {
      color: var(--text);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .layer-page-pill {
      font-size: 9px;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0 4px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .layer-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .layer-btn {
      width: 20px;
      height: 20px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--bg);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .layer-btn:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--bg-hover);
    }

    .layer-btn.break-single:hover {
      color: var(--danger);
      border-color: var(--danger);
      background: var(--danger-bg);
    }

    /* Clean / Empty State */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
      gap: 12px;
      flex: 1;
    }

    .empty-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--success-bg);
      color: var(--success);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .empty-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    /* Initial Empty State Card */
    .initial-empty-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      text-align: center;
      flex: 1;
      height: 100%;
    }

    .initial-empty-card {
      background: var(--bg);
      border: none;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 330px;
      width: 100%;
    }

    .initial-empty-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(24, 160, 251, 0.12), rgba(99, 102, 241, 0.15));
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .initial-empty-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .initial-empty-desc {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 18px;
      max-width: 270px;
    }

    .initial-scope-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 6px 10px;
      background: var(--bg-subtle);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .initial-scope-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .initial-scope-selector {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 2px;
      border-radius: var(--radius-sm);
      gap: 2px;
    }

    .initial-scope-btn {
      padding: 3px 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 3px;
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .initial-scope-btn.active {
      background: var(--primary);
      color: white;
      font-weight: 600;
    }

    .btn-primary-start-scan {
      width: 100%;
      padding: 9px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--primary);
      background: var(--primary);
      color: white;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      margin-bottom: 10px;
    }

    .btn-primary-start-scan:hover {
      background: #0b69a3;
      border-color: #0b69a3;
      box-shadow: none;
    }

    .btn-primary-start-scan:active {
      background: #085585;
      border-color: #085585;
    }

    .btn-settings-link {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      transition: all 0.15s ease;
    }

    .btn-settings-link:hover {
      color: var(--text);
      background: var(--bg-hover);
    }

    .settings-top-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .btn-back-settings {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-back-settings:hover {
      background: var(--bg-hover);
      border-color: #cbd5e1;
    }

    /* Loading Overlay (Dark Theme) */
    .loading-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(18, 18, 20, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .loading-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .loading-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .loading-status {
      font-size: 12px;
      font-weight: 600;
      color: #f3f4f6 !important;
      text-align: center;
      max-width: 90%;
      line-height: 1.4;
      letter-spacing: -0.01em;
    }

    .loading-progress-bar {
      width: 240px;
      height: 5px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    .loading-progress-fill {
      height: 100%;
      width: 0%;
      background: #18a0fb;
      box-shadow: 0 0 8px rgba(24, 160, 251, 0.6);
      transition: width 0.15s ease;
      border-radius: 3px;
    }

    /* Pages Scan Queue Box */
    .loading-pages-box {
      width: 100%;
      max-width: 400px;
      height: 380px;
      max-height: 400px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-sizing: border-box;
    }

    .loading-pages-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #9ca3af;
      padding: 0 4px 2px;
      flex-shrink: 0;
    }

    .loading-pages-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-right: 2px;
      scroll-behavior: smooth;
    }

    .loading-pages-list::-webkit-scrollbar {
      width: 4px;
    }
    .loading-pages-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .loading-pages-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .page-scan-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 11px;
      transition: background 0.15s ease, border-color 0.15s ease;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
    }

    .page-scan-row.active {
      background: rgba(24, 160, 251, 0.14);
      border-color: rgba(24, 160, 251, 0.35);
    }

    .page-scan-row.completed {
      opacity: 0.88;
    }

    .page-scan-row.pending {
      opacity: 0.45;
    }

    .page-scan-row.next {
      opacity: 0.75;
      background: rgba(255, 255, 255, 0.04);
    }

    .page-scan-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-scan-icon.completed {
      color: #10b981;
    }

    .page-scan-icon.active {
      position: relative;
    }

    .scan-radar-emitter {
      position: relative;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scan-pulse-dot {
      width: 6px;
      height: 6px;
      background: #18a0fb;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(24, 160, 251, 0.95);
      position: relative;
      z-index: 2;
      flex-shrink: 0;
    }

    .scan-pulse-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      border: 1.5px solid rgba(24, 160, 251, 0.9);
      box-sizing: border-box;
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center center;
      animation: ripple-scan 1.8s cubic-bezier(0.15, 0.5, 0.3, 1) infinite;
      pointer-events: none;
      z-index: 1;
    }

    .scan-pulse-ring.ring-2 {
      animation-delay: 0.9s;
    }

    .scan-pulse-dot > .scan-pulse-ring {
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
    }

    @keyframes ripple-scan {
      0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.95;
        border-width: 1.5px;
      }
      40% {
        opacity: 0.55;
      }
      100% {
        transform: translate(-50%, -50%) scale(3.2);
        opacity: 0;
        border-width: 1px;
      }
    }

    .page-scan-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
      color: #e5e7eb;
    }

    .page-scan-row.active .page-scan-name {
      color: #ffffff;
      font-weight: 600;
    }

    .page-scan-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      flex-shrink: 0;
      letter-spacing: 0.02em;
      border: 1px solid transparent;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
      line-height: 1.3;
      box-sizing: border-box;
      min-height: 19px;
    }

    button.page-scan-badge {
      cursor: pointer;
      font-family: inherit;
      outline: none;
      user-select: none;
    }

    .page-scan-badge.completed {
      color: #10b981;
      background: rgba(16, 185, 129, 0.14);
      border-color: transparent;
    }

    .page-scan-badge.active {
      color: #18a0fb;
      background: rgba(24, 160, 251, 0.2);
      border-color: transparent;
    }

    .page-scan-badge.next {
      color: #94a3b8;
      background: rgba(148, 163, 184, 0.12);
      border-color: transparent;
    }

    .page-scan-badge.pending {
      color: #64748b;
      background: transparent;
      border-color: transparent;
    }

    .page-scan-badge.paused,
    .page-scan-badge.skipped {
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.16);
      border-color: rgba(245, 158, 11, 0.35);
    }

    .page-scan-row.paused {
      opacity: 0.6;
      background: rgba(245, 158, 11, 0.04);
    }

    .page-scan-icon.paused {
      color: #fbbf24;
    }

    .page-scan-badge .badge-label {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .page-scan-badge .badge-hover-action {
      display: none;
      align-items: center;
      gap: 3px;
    }

    /* On hover of button or row, show Pause icon on Queued / Up Next / Active */
    button.page-scan-badge.next:hover,
    button.page-scan-badge.pending:hover,
    button.page-scan-badge.active:hover,
    .page-scan-row.next:hover button.page-scan-badge:not(.paused),
    .page-scan-row.pending:hover button.page-scan-badge:not(.paused),
    .page-scan-row.active:hover button.page-scan-badge:not(.paused) {
      background: rgba(245, 158, 11, 0.22);
      border-color: rgba(245, 158, 11, 0.5);
      color: #fbbf24;
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.25);
    }

    button.page-scan-badge.next:hover .badge-label,
    button.page-scan-badge.pending:hover .badge-label,
    button.page-scan-badge.active:hover .badge-label,
    .page-scan-row.next:hover button.page-scan-badge:not(.paused) .badge-label,
    .page-scan-row.pending:hover button.page-scan-badge:not(.paused) .badge-label,
    .page-scan-row.active:hover button.page-scan-badge:not(.paused) .badge-label {
      display: none;
    }

    button.page-scan-badge.next:hover .badge-hover-action,
    button.page-scan-badge.pending:hover .badge-hover-action,
    button.page-scan-badge.active:hover .badge-hover-action,
    .page-scan-row.next:hover button.page-scan-badge:not(.paused) .badge-hover-action,
    .page-scan-row.pending:hover button.page-scan-badge:not(.paused) .badge-hover-action,
    .page-scan-row.active:hover button.page-scan-badge:not(.paused) .badge-hover-action {
      display: inline-flex;
    }

    /* On hover of Paused button, show Resume icon */
    button.page-scan-badge.paused:hover,
    .page-scan-row.paused:hover button.page-scan-badge.paused {
      background: rgba(59, 130, 246, 0.22);
      border-color: rgba(59, 130, 246, 0.5);
      color: #60a5fa;
      box-shadow: 0 0 6px rgba(59, 130, 246, 0.25);
    }

    button.page-scan-badge.paused:hover .badge-label,
    .page-scan-row.paused:hover button.page-scan-badge.paused .badge-label {
      display: none;
    }

    button.page-scan-badge.paused:hover .badge-hover-action,
    .page-scan-row.paused:hover button.page-scan-badge.paused .badge-hover-action {
      display: inline-flex;
    }

    .btn-cancel-scan {
      margin-top: 6px;
      padding: 6px 16px;
      font-size: 11px;
      font-weight: 600;
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: var(--radius);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-cancel-scan:hover {
      background: #ef4444;
      color: #ffffff;
      border-color: #ef4444;
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.35);
    }

    .btn-cancel-scan:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Footer */
    footer {
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .footer-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .btn-scan {
      flex: 1;
      width: 100%;
      height: 32px;
      padding: 0 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease;
    }

    .btn-scan:hover {
      background: var(--primary-hover);
      box-shadow: none;
    }

    .btn-break-everything {
      flex: 1;
      height: 32px;
      padding: 0 12px;
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger-border);
      border-radius: var(--radius);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.15s ease;
    }

    .btn-break-everything:hover {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
      box-shadow: none;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header id="main-header" style="display: none;">
    <div class="header-top">
      <div class="brand">
        <div class="brand-icon">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
            <path d="M6 6h10"/>
            <path d="M6 10h10"/>
          </svg>
        </div>
        <div class="brand-title">Missing Library Finder</div>
      </div>
      <div id="header-scope" class="scope-selector" style="display: none;">
        <button id="scope-all" class="scope-btn active" title="Scan entire document (all pages)">All Pages</button>
        <button id="scope-current" class="scope-btn" title="Scan active page only">Current Page</button>
      </div>
    </div>
  </header>

  <!-- Controls Bar (Tabs & Search) -->
  <div id="controls-bar" class="controls-bar" style="display: none;">
    <div class="tabs">
      <button class="tab-btn active" data-tab="all">
        All Issues <span id="badge-all" class="tab-badge">0</span>
      </button>
      <button class="tab-btn" data-tab="colors">
        Colors <span id="badge-colors" class="tab-badge">0</span>
      </button>
      <button class="tab-btn" data-tab="fonts">
        Fonts & Text <span id="badge-fonts" class="tab-badge">0</span>
      </button>
      <button class="tab-btn" data-tab="settings" title="Detection Settings">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>Settings</span>
      </button>
    </div>

    <div class="filter-row">
      <div class="search-box">
        <span class="search-icon">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/>
            <line x1="21" y1="21" x2="16" y2="16"/>
          </svg>
        </span>
        <input id="search-input" class="search-input" type="text" placeholder="Filter by style name (e.g. Colors/Primary)...">
        <button id="search-clear-btn" class="search-clear-btn" title="Clear search" type="button" aria-label="Clear search">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Content List -->
  <main id="content-list" class="content-area">
    <!-- Populated dynamically -->
  </main>

  <!-- Loading Overlay -->
  <div id="loading" class="loading-container">
    <div class="loading-header">
      <div id="loading-status" class="loading-status">Scanning document for missing libraries...</div>
      <div class="loading-progress-bar"><div id="loading-progress-fill" class="loading-progress-fill"></div></div>
    </div>
    <div id="loading-pages-box" class="loading-pages-box" style="display: none;">
      <div class="loading-pages-header">
        <span id="loading-pages-count">Pages to scan</span>
        <span id="loading-overall-percent">0%</span>
      </div>
      <div id="loading-pages-list" class="loading-pages-list">
        <!-- Populated dynamically -->
      </div>
    </div>
    <button id="btn-cancel-scan" class="btn-cancel-scan" type="button">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" stroke="none">
        <rect x="4" y="4" width="16" height="16" rx="2"/>
      </svg>
      <span>Stop Scan</span>
    </button>
  </div>

  <!-- Footer -->
  <footer id="footer" style="display: none;">
    <div class="footer-actions">
      <button id="btn-break-everything" class="btn-break-everything" title="Detach all missing colors and fonts" style="display: none;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        <span>Clean All</span>
      </button>
      <button id="btn-scan" class="btn-scan">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        <span>Scan Now</span>
      </button>
    </div>
  </footer>

  <script>
    // State management
    let state = {
      hasScanned: false,
      scope: 'all',          // Default: all pages to match Figma's Missing Libraries modal
      currentTab: 'all',
      searchQuery: '',
      settings: {
        detectShapeColors: true,
        detectTextColors: true,
        detectFills: true,
        detectStrokes: true,
        detectVariables: true,
        detectTextStyles: true,
        detectMissingFonts: true,
        detectEffects: true,
        scanHiddenLayers: true
      },
      results: {
        colors: [],
        fonts: [],
        effects: []
      },
      stats: {
        totalColors: 0,
        totalFonts: 0,
        totalEffects: 0,
        totalScannedNodes: 0
      },
      selectedFont: {
        family: 'Inter',
        style: 'Regular'
      },
      expandedCards: new Set()
    };

    // Instant local cache restore
    try {
      const cached = localStorage.getItem('mlf_settings');
      if (cached) {
        const parsed = JSON.parse(cached);
        if (parsed && typeof parsed === 'object') {
          if (parsed.settings) state.settings = { ...state.settings, ...parsed.settings };
          if (parsed.scope) state.scope = parsed.scope;
        }
      }
    } catch (e) {}

    // DOM Elements
    const scopeCurrentBtn = document.getElementById('scope-current');
    const scopeAllBtn = document.getElementById('scope-all');
    const contentList = document.getElementById('content-list');
    const searchInput = document.getElementById('search-input');
    const searchClearBtn = document.getElementById('search-clear-btn');
    const btnBreakEverything = document.getElementById('btn-break-everything');
    const btnScan = document.getElementById('btn-scan');
    const loadingOverlay = document.getElementById('loading');
    const loadingStatus = document.getElementById('loading-status');
    const loadingProgressFill = document.getElementById('loading-progress-fill');
    const loadingPagesBox = document.getElementById('loading-pages-box');
    const loadingPagesList = document.getElementById('loading-pages-list');
    const loadingPagesCount = document.getElementById('loading-pages-count');
    const loadingOverallPercent = document.getElementById('loading-overall-percent');
    const btnCancelScan = document.getElementById('btn-cancel-scan');
    const badgeAll = document.getElementById('badge-all');
    const badgeColors = document.getElementById('badge-colors');
    const badgeFonts = document.getElementById('badge-fonts');

    // Page Scan Queue rendering, pause/skip and state
    const pausedPages = new Set();
    let lastScanProgressData = null;

    function initLoadingPages(pages) {
      if (!loadingPagesBox || !loadingPagesList) return;
      loadingPagesList.innerHTML = '';
      pausedPages.clear();
      lastScanProgressData = null;

      if (!pages || pages.length === 0) {
        loadingPagesBox.style.display = 'none';
        return;
      }
      loadingPagesBox.style.display = 'flex';
      if (loadingPagesCount) {
        loadingPagesCount.textContent = `Pages (${pages.length})`;
      }
      if (loadingOverallPercent) {
        loadingOverallPercent.textContent = '0%';
      }

      pages.forEach((p, idx) => {
        const row = document.createElement('div');
        row.className = 'page-scan-row ' + (idx === 0 ? 'active' : (idx === 1 ? 'next' : 'pending'));
        row.id = `scan-page-row-${idx}`;
        row.dataset.pageIndex = idx;
        row.dataset.pageId = p.id;

        let iconHtml = '';
        let badgeHtml = '';
        if (idx === 0) {
          iconHtml = '<span class="scan-radar-emitter"><span class="scan-pulse-ring"></span><span class="scan-pulse-ring ring-2"></span><span class="scan-pulse-dot"></span></span>';
          badgeHtml = `
            <button type="button" class="page-scan-badge active" data-page-index="${idx}" data-page-id="${p.id}" title="Pause/Skip this page from scan">
              <span class="badge-label">Scanning</span>
              <span class="badge-hover-action">
                <svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor">
                  <rect x="6" y="4" width="4" height="16" rx="1"/>
                  <rect x="14" y="4" width="4" height="16" rx="1"/>
                </svg>
                <span>Pause</span>
              </span>
            </button>
          `;
        } else if (idx === 1) {
          iconHtml = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6"/></svg>';
          badgeHtml = `
            <button type="button" class="page-scan-badge next" data-page-index="${idx}" data-page-id="${p.id}" title="Pause/Skip this page from scan">
              <span class="badge-label">Up Next</span>
              <span class="badge-hover-action">
                <svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor">
                  <rect x="6" y="4" width="4" height="16" rx="1"/>
                  <rect x="14" y="4" width="4" height="16" rx="1"/>
                </svg>
                <span>Pause</span>
              </span>
            </button>
          `;
        } else {
          iconHtml = '<svg width="8" height="8" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" fill="#64748b"/></svg>';
          badgeHtml = `
            <button type="button" class="page-scan-badge pending" data-page-index="${idx}" data-page-id="${p.id}" title="Pause/Skip this page from scan">
              <span class="badge-label">Queued</span>
              <span class="badge-hover-action">
                <svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor">
                  <rect x="6" y="4" width="4" height="16" rx="1"/>
                  <rect x="14" y="4" width="4" height="16" rx="1"/>
                </svg>
                <span>Pause</span>
              </span>
            </button>
          `;
        }

        row.innerHTML = `
          <div class="page-scan-icon ${idx === 0 ? 'active' : ''}">${iconHtml}</div>
          <div class="page-scan-name" title="${p.name}">${p.name}</div>
          <div class="page-scan-badge-wrap">${badgeHtml}</div>
        `;
        loadingPagesList.appendChild(row);
      });
    }

    function updatePagesProgress(data) {
      if (!loadingPagesList) return;
      lastScanProgressData = data;
      const currentIdx = typeof data.currentPageIndex === 'number' ? data.currentPageIndex : -1;
      const percent = typeof data.percent === 'number' ? data.percent : 0;

      if (loadingOverallPercent) {
        loadingOverallPercent.textContent = `${Math.min(100, Math.max(0, percent))}%`;
      }

      const rows = loadingPagesList.querySelectorAll('.page-scan-row');
      rows.forEach((row, idx) => {
        const iconEl = row.querySelector('.page-scan-icon');
        const badgeWrap = row.querySelector('.page-scan-badge-wrap');
        if (!iconEl || !badgeWrap) return;

        const pId = row.dataset.pageId;
        const isPaused = pausedPages.has(idx) || (pId && pausedPages.has(pId)) || row.classList.contains('skipped');

        if (isPaused) {
          if (idx < currentIdx && row.classList.contains('skipped')) {
            row.className = 'page-scan-row paused skipped';
            iconEl.className = 'page-scan-icon paused';
            iconEl.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="#fbbf24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
            badgeWrap.innerHTML = '<span class="page-scan-badge paused">Skipped</span>';
          } else {
            row.className = 'page-scan-row paused';
            iconEl.className = 'page-scan-icon paused';
            iconEl.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="#fbbf24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
            badgeWrap.innerHTML = `
              <button type="button" class="page-scan-badge paused" data-page-index="${idx}" data-page-id="${pId || ''}" title="Resume scanning this page">
                <span class="badge-label">
                  <svg width="7" height="7" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 2px;">
                    <rect x="6" y="4" width="4" height="16" rx="1"/>
                    <rect x="14" y="4" width="4" height="16" rx="1"/>
                  </svg>
                  <span>Paused</span>
                </span>
                <span class="badge-hover-action">
                  <svg width="7" height="7" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5 3 19 12 5 21 5 3"/>
                  </svg>
                  <span>Resume</span>
                </span>
              </button>
            `;
          }
        } else if (idx < currentIdx) {
          // Completed page: check on left side, done badge
          row.className = 'page-scan-row completed';
          iconEl.className = 'page-scan-icon completed';
          iconEl.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
          const doneText = row.dataset.hasLayerCount ? row.dataset.layerCountText : 'Done';
          badgeWrap.innerHTML = `<span class="page-scan-badge completed">${doneText}</span>`;
        } else if (idx === currentIdx) {
          // Active currently scanning page: dual ripple radar dot
          row.className = 'page-scan-row active';
          iconEl.className = 'page-scan-icon active';
          iconEl.innerHTML = '<span class="scan-radar-emitter"><span class="scan-pulse-ring"></span><span class="scan-pulse-ring ring-2"></span><span class="scan-pulse-dot"></span></span>';

          let scanStatusText = 'Scanning';
          if (data.totalLayers && data.totalLayers > 0 && typeof data.inspectedLayers === 'number') {
            const pagePct = Math.round((data.inspectedLayers / data.totalLayers) * 100);
            scanStatusText = `Scanning (${pagePct}%)`;
          }
          badgeWrap.innerHTML = `
            <button type="button" class="page-scan-badge active" data-page-index="${idx}" data-page-id="${pId || ''}" title="Pause / Skip scanning this page">
              <span class="badge-label">${scanStatusText}</span>
              <span class="badge-hover-action">
                <svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor">
                  <rect x="6" y="4" width="4" height="16" rx="1"/>
                  <rect x="14" y="4" width="4" height="16" rx="1"/>
                </svg>
                <span>Pause</span>
              </span>
            </button>
          `;
        } else if (idx === currentIdx + 1) {
          // Immediate next page
          row.className = 'page-scan-row next';
          iconEl.className = 'page-scan-icon';
          iconEl.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6"/></svg>';
          badgeWrap.innerHTML = `
            <button type="button" class="page-scan-badge next" data-page-index="${idx}" data-page-id="${pId || ''}" title="Pause / Skip scanning this page">
              <span class="badge-label">Up Next</span>
              <span class="badge-hover-action">
                <svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor">
                  <rect x="6" y="4" width="4" height="16" rx="1"/>
                  <rect x="14" y="4" width="4" height="16" rx="1"/>
                </svg>
                <span>Pause</span>
              </span>
            </button>
          `;
        } else {
          // Upcoming queued pages
          row.className = 'page-scan-row pending';
          iconEl.className = 'page-scan-icon';
          iconEl.innerHTML = '<svg width="8" height="8" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" fill="#64748b"/></svg>';
          badgeWrap.innerHTML = `
            <button type="button" class="page-scan-badge pending" data-page-index="${idx}" data-page-id="${pId || ''}" title="Pause / Skip scanning this page">
              <span class="badge-label">Queued</span>
              <span class="badge-hover-action">
                <svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor">
                  <rect x="6" y="4" width="4" height="16" rx="1"/>
                  <rect x="14" y="4" width="4" height="16" rx="1"/>
                </svg>
                <span>Pause</span>
              </span>
            </button>
          `;
        }
      });

      // Keep currently scanning row in view
      const activeRow = loadingPagesList.querySelector('.page-scan-row.active');
      if (activeRow) {
        activeRow.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }

    function completeLoadingPage(pageIndex, nodeCount) {
      if (!loadingPagesList) return;
      const row = document.getElementById(`scan-page-row-${pageIndex}`);
      if (!row) return;
      if (row.classList.contains('skipped')) return;

      row.className = 'page-scan-row completed';
      row.dataset.hasLayerCount = 'true';
      const layerText = typeof nodeCount === 'number' ? `${nodeCount.toLocaleString()} layers` : 'Done';
      row.dataset.layerCountText = layerText;
      const iconEl = row.querySelector('.page-scan-icon');
      if (iconEl) {
        iconEl.className = 'page-scan-icon completed';
        iconEl.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
      }
      const badgeWrap = row.querySelector('.page-scan-badge-wrap');
      if (badgeWrap) {
        badgeWrap.innerHTML = `<span class="page-scan-badge completed">${layerText}</span>`;
      }
    }

    function skipLoadingPage(pageIndex) {
      if (!loadingPagesList) return;
      const row = document.getElementById(`scan-page-row-${pageIndex}`);
      if (!row) return;

      row.className = 'page-scan-row paused skipped';
      row.classList.add('skipped');
      const iconEl = row.querySelector('.page-scan-icon');
      if (iconEl) {
        iconEl.className = 'page-scan-icon paused';
        iconEl.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="#fbbf24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
      }
      const badgeWrap = row.querySelector('.page-scan-badge-wrap');
      if (badgeWrap) {
        badgeWrap.innerHTML = '<span class="page-scan-badge paused">Skipped</span>';
      }
    }

    if (loadingPagesList) {
      loadingPagesList.addEventListener('click', (e) => {
        const btn = e.target.closest('button.page-scan-badge');
        if (!btn) return;
        e.stopPropagation();

        const pIdx = parseInt(btn.dataset.pageIndex, 10);
        const pId = btn.dataset.pageId;
        const isPaused = pausedPages.has(pIdx) || (pId && pausedPages.has(pId));

        if (isPaused) {
          pausedPages.delete(pIdx);
          if (pId) pausedPages.delete(pId);
          parent.postMessage({
            pluginMessage: {
              type: 'toggle-page-skip',
              pageIndex: pIdx,
              pageId: pId,
              skip: false
            }
          }, '*');
        } else {
          pausedPages.add(pIdx);
          if (pId) pausedPages.add(pId);
          parent.postMessage({
            pluginMessage: {
              type: 'toggle-page-skip',
              pageIndex: pIdx,
              pageId: pId,
              skip: true
            }
          }, '*');
        }

        if (lastScanProgressData) {
          updatePagesProgress(lastScanProgressData);
        }
      });
    }

    function syncScopeUI() {
      if (scopeCurrentBtn && scopeAllBtn) {
        scopeCurrentBtn.classList.toggle('active', state.scope === 'current');
        scopeAllBtn.classList.toggle('active', state.scope === 'all');
      }
      document.querySelectorAll('.initial-scope-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.scope === state.scope);
      });
    }

    function setScope(newScope) {
      if (state.scope === newScope) return;
      state.scope = newScope;
      syncScopeUI();
      saveSettings();
      if (state.hasScanned) {
        triggerScan();
      }
    }

    // Initialize scope button active classes
    syncScopeUI();

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.currentTab = btn.dataset.tab;
        const filterRow = document.querySelector('.filter-row');
        if (filterRow) {
          filterRow.style.display = state.currentTab === 'settings' ? 'none' : 'flex';
        }
        render();
      });
    });

    // Scope switching
    scopeCurrentBtn.addEventListener('click', () => {
      setScope('current');
    });

    scopeAllBtn.addEventListener('click', () => {
      setScope('all');
    });

    // Search query & clear handling
    function updateSearchClearBtn() {
      if (searchClearBtn) {
        searchClearBtn.classList.toggle('visible', searchInput.value.length > 0);
      }
    }

    function clearSearch() {
      searchInput.value = '';
      state.searchQuery = '';
      updateSearchClearBtn();
      searchInput.focus();
      render();
    }

    searchInput.addEventListener('input', (e) => {
      state.searchQuery = e.target.value.trim();
      updateSearchClearBtn();
      render();
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        clearSearch();
      }
    });

    if (searchClearBtn) {
      searchClearBtn.addEventListener('click', () => {
        clearSearch();
      });
    }

    // Scan button
    btnScan.addEventListener('click', () => {
      triggerScan();
    });

    function triggerScan() {
      loadingOverlay.classList.add('active');
      loadingStatus.textContent = `Preparing ${state.scope === 'all' ? 'all pages' : 'current page'} scan...`;
      if (loadingProgressFill) loadingProgressFill.style.width = '0%';
      if (loadingPagesBox) loadingPagesBox.style.display = 'none';
      if (loadingPagesList) loadingPagesList.innerHTML = '';
      if (loadingOverallPercent) loadingOverallPercent.textContent = '0%';
      if (btnCancelScan) {
        btnCancelScan.disabled = false;
        btnCancelScan.innerHTML = `
          <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" stroke="none">
            <rect x="4" y="4" width="16" height="16" rx="2"/>
          </svg>
          <span>Stop Scan</span>
        `;
      }
      parent.postMessage({
        pluginMessage: {
          type: 'scan',
          scope: state.scope
        }
      }, '*');
    }

    if (btnCancelScan) {
      btnCancelScan.addEventListener('click', () => {
        loadingStatus.textContent = 'Stopping scan and preparing results...';
        btnCancelScan.disabled = true;
        btnCancelScan.innerHTML = `<span>Stopping...</span>`;
        parent.postMessage({
          pluginMessage: { type: 'cancel-scan' }
        }, '*');
      });
    }

    // Clean everything button
    btnBreakEverything.addEventListener('click', () => {
      loadingOverlay.classList.add('active');
      loadingStatus.textContent = 'Cleaning all missing library references...';
      if (loadingPagesBox) loadingPagesBox.style.display = 'none';
      parent.postMessage({
        pluginMessage: {
          type: 'break-category',
          category: 'all',
          scope: state.scope,
          replacementFont: state.selectedFont
        }
      }, '*');
    });

    // Handle messages from plugin backend
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'init-settings' && msg.settings) {
        state.settings = { ...state.settings, ...msg.settings };
        if (msg.scope || msg.settings.scope) {
          state.scope = msg.scope || msg.settings.scope;
        }
        try {
          localStorage.setItem('mlf_settings', JSON.stringify({
            settings: state.settings,
            scope: state.scope
          }));
        } catch (e) {}
        syncScopeUI();
        if (state.currentTab === 'settings' || !state.hasScanned) render();
      } else if (msg.type === 'scan-init-pages') {
        initLoadingPages(msg.pages);
      } else if (msg.type === 'scan-progress') {
        loadingStatus.textContent = msg.status || 'Scanning...';
        if (loadingProgressFill && typeof msg.percent === 'number') {
          loadingProgressFill.style.width = `${Math.min(100, Math.max(0, msg.percent))}%`;
        }
        updatePagesProgress(msg);
      } else if (msg.type === 'scan-page-completed') {
        completeLoadingPage(msg.pageIndex, msg.nodeCount);
      } else if (msg.type === 'scan-page-skipped') {
        skipLoadingPage(msg.pageIndex);
      } else if (msg.type === 'scan-results') {
        try {
          state.hasScanned = true;

          // Immediately reflect 100% complete state in loading bar
          if (loadingProgressFill) loadingProgressFill.style.width = '100%';
          if (loadingOverallPercent) loadingOverallPercent.textContent = '100%';
          if (loadingStatus) loadingStatus.textContent = 'Scan complete! Rendering results...';

          if (btnCancelScan) {
            btnCancelScan.disabled = false;
            btnCancelScan.innerHTML = `
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                <rect x="4" y="4" width="16" height="16" rx="2"/>
              </svg>
              <span>Stop Scan</span>
            `;
          }
          if (msg.settings) {
            state.settings = { ...state.settings, ...msg.settings };
          }
          if (msg.scope) {
            state.scope = msg.scope;
          }
          try {
            localStorage.setItem('mlf_settings', JSON.stringify({
              settings: state.settings,
              scope: state.scope
            }));
          } catch (e) {}
          syncScopeUI();
          state.results = msg.results || { colors: [], fonts: [], effects: [] };
          state.stats = msg.stats || { totalColors: 0, totalFonts: 0, totalEffects: 0 };
          updateStats();

          // Yield execution to allow the browser to paint the 100% state and dismiss smoothly
          setTimeout(() => {
            loadingOverlay.classList.remove('active');
            if (loadingPagesBox) loadingPagesBox.style.display = 'none';
            if (loadingProgressFill) loadingProgressFill.style.width = '0%';
            render();
          }, 60);
        } catch (scanErr) {
          console.error('Error handling scan-results:', scanErr);
          loadingOverlay.classList.remove('active');
          if (loadingPagesBox) loadingPagesBox.style.display = 'none';
          render();
        }
      } else if (msg.type === 'category-broken') {
        loadingOverlay.classList.remove('active');
        if (msg.category === 'all') {
          state.results = { colors: [], fonts: [], effects: [] };
          state.stats = { totalColors: 0, totalFonts: 0, totalEffects: 0 };
        } else if (msg.category === 'colors') {
          state.results.colors = [];
        } else if (msg.category === 'fonts') {
          state.results.fonts = [];
        } else if (msg.category === 'effects') {
          state.results.effects = [];
        }
        recalculateStats();
        updateStats();
        render();
      } else if (msg.type === 'item-broken') {
        // Confirmed by backend
      }
    };

    // Request saved settings from plugin backend immediately
    parent.postMessage({
      pluginMessage: { type: 'get-settings' }
    }, '*');

    function recalculateStats() {
      let totalColors = 0;
      (state.results.colors || []).forEach(it => {
        totalColors += (it.nodes ? it.nodes.length : 0);
      });

      let totalFonts = 0;
      (state.results.fonts || []).forEach(it => {
        totalFonts += (it.nodes ? it.nodes.length : 0);
      });

      let totalEffects = 0;
      (state.results.effects || []).forEach(it => {
        totalEffects += (it.nodes ? it.nodes.length : 0);
      });

      state.stats = {
        totalColors,
        totalFonts,
        totalEffects
      };
    }

    function removeItemFromState(itemKey) {
      state.results.colors = (state.results.colors || []).filter(it => it.key !== itemKey);
      state.results.fonts = (state.results.fonts || []).filter(it => it.key !== itemKey);
      state.results.effects = (state.results.effects || []).filter(it => it.key !== itemKey);
      state.expandedCards.delete(itemKey);

      recalculateStats();
      updateStats();
      render();
    }

    function removeLayerFromItem(itemKey, nodeId, cardElem, rowElem) {
      const allItems = [...(state.results.colors || []), ...(state.results.fonts || []), ...(state.results.effects || [])];
      const item = allItems.find(it => it.key === itemKey);
      if (!item) return;

      item.nodes = (item.nodes || []).filter(n => n.id !== nodeId);

      if (item.nodes.length === 0) {
        removeItemFromState(itemKey);
      } else {
        if (rowElem && rowElem.parentNode) {
          rowElem.remove();
        }
        if (cardElem) {
          const countTag = cardElem.querySelector('.layer-count-tag');
          if (countTag) {
            countTag.textContent = `${item.nodes.length} layer${item.nodes.length === 1 ? '' : 's'}`;
          }
          const paginationSpan = cardElem.querySelector('.drawer-pagination-row span');
          const drawer = cardElem.querySelector('.layers-drawer');
          if (paginationSpan && drawer) {
            const currentRendered = drawer.querySelectorAll('.layer-row').length;
            paginationSpan.textContent = `Showing ${currentRendered.toLocaleString()} of ${item.nodes.length.toLocaleString()} layers`;
          }
        }
        recalculateStats();
        updateStats();
      }
    }

    function updateStats() {
      if (!state.hasScanned) {
        badgeColors.textContent = '0';
        badgeFonts.textContent = '0';
        badgeAll.textContent = '0';
        btnBreakEverything.style.display = 'none';
        return;
      }

      const uniqueColors = state.results.colors.length;
      const uniqueFonts = state.results.fonts.length;
      const totalUnique = uniqueColors + uniqueFonts;

      badgeColors.textContent = uniqueColors;
      badgeFonts.textContent = uniqueFonts;
      badgeAll.textContent = totalUnique;

      btnBreakEverything.style.display = totalUnique > 0 ? 'flex' : 'none';
    }

    function updateVisibility() {
      const mainHeader = document.getElementById('main-header');
      const headerScope = document.getElementById('header-scope');
      const controlsBar = document.getElementById('controls-bar');
      const footerElem = document.getElementById('footer');

      if (!state.hasScanned) {
        if (mainHeader) mainHeader.style.display = 'none';
        if (headerScope) headerScope.style.display = 'none';
        if (controlsBar) controlsBar.style.display = 'none';
        if (footerElem) footerElem.style.display = 'none';
      } else {
        if (mainHeader) mainHeader.style.display = 'flex';
        if (headerScope) headerScope.style.display = 'flex';
        if (controlsBar) {
          controlsBar.style.display = 'flex';
          const filterRow = document.querySelector('.filter-row');
          if (filterRow) {
            filterRow.style.display = state.currentTab === 'settings' ? 'none' : 'flex';
          }
        }
        if (footerElem) footerElem.style.display = 'flex';
      }
    }

    function render() {
      updateVisibility();
      contentList.innerHTML = '';

      if (state.currentTab === 'settings') {
        renderSettings();
        return;
      }

      if (!state.hasScanned) {
        renderInitialEmptyState();
        return;
      }

      let items = [];
      if (state.currentTab === 'colors') {
        items = [...state.results.colors];
      } else if (state.currentTab === 'fonts') {
        items = [...state.results.fonts];
      } else {
        items = [...state.results.colors, ...state.results.fonts, ...state.results.effects];
      }

      // Filter by search query (case-sensitive)
      if (state.searchQuery) {
        items = items.filter(item => {
          const matchName = item.name && item.name.includes(state.searchQuery);
          const matchFamily = item.fontFamily && item.fontFamily.includes(state.searchQuery);
          const matchType = item.subType && item.subType.includes(state.searchQuery);
          const matchLayers = item.nodes && item.nodes.some(n => n.name && n.name.includes(state.searchQuery));
          return matchName || matchFamily || matchType || matchLayers;
        });
      }

      if (items.length === 0) {
        renderEmptyState();
        return;
      }

      items.forEach(item => {
        const card = createItemCard(item);
        contentList.appendChild(card);
      });
    }

    function renderSettings() {
      const panel = document.createElement('div');
      panel.className = 'settings-panel';

      const topBarHtml = !state.hasScanned ? `
        <div class="settings-top-bar">
          <button id="btn-back-to-scan" class="btn-back-settings" title="Back to Scan">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"/>
              <polyline points="12 19 5 12 12 5"/>
            </svg>
            <span>Back</span>
          </button>
          <span style="font-weight: 600; font-size: 12px; margin-left: 4px;">Detection Settings</span>
        </div>
      ` : '';

      panel.innerHTML = `
        ${topBarHtml}
        <div class="settings-section">
          <div class="settings-section-header">
            <span>Color & Style Detection</span>
          </div>
          <div class="setting-row">
            <div class="setting-left">
              <div class="setting-name">Shape Colors</div>
              <div class="setting-desc">Detect missing or remote colors on vector shapes, frames, and components</div>
            </div>
            <label class="switch">
              <input type="checkbox" id="set-shape-colors" ${state.settings.detectShapeColors !== false ? 'checked' : ''}>
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <div class="setting-left">
              <div class="setting-name">Text Colors</div>
              <div class="setting-desc">Detect missing or remote colors applied to text layers</div>
            </div>
            <label class="switch">
              <input type="checkbox" id="set-text-colors" ${state.settings.detectTextColors !== false ? 'checked' : ''}>
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <div class="setting-left">
              <div class="setting-name">Missing Fill Styles</div>
              <div class="setting-desc">Detect unlinked or remote color styles applied to layer fills</div>
            </div>
            <label class="switch">
              <input type="checkbox" id="set-fills" ${state.settings.detectFills ? 'checked' : ''}>
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <div class="setting-left">
              <div class="setting-name">Missing Stroke Styles</div>
              <div class="setting-desc">Detect unlinked or remote color styles applied to strokes & borders</div>
            </div>
            <label class="switch">
              <input type="checkbox" id="set-strokes" ${state.settings.detectStrokes ? 'checked' : ''}>
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <div class="setting-left">
              <div class="setting-name">Bound Color Variables</div>
              <div class="setting-desc">Detect missing or remote design tokens and color variable bindings</div>
            </div>
            <label class="switch">
              <input type="checkbox" id="set-variables" ${state.settings.detectVariables ? 'checked' : ''}>
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-section-header">
            <span>Typography & Font Detection</span>
          </div>
          <div class="setting-row">
            <div class="setting-left">
              <div class="setting-name">Missing Text Styles</div>
              <div class="setting-desc">Detect unlinked or remote typography styles</div>
            </div>
            <label class="switch">
              <input type="checkbox" id="set-text-styles" ${state.settings.detectTextStyles ? 'checked' : ''}>
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <div class="setting-left">
              <div class="setting-name">Missing Font Families</div>
              <div class="setting-desc">Detect text layers using fonts not installed on this system</div>
            </div>
            <label class="switch">
              <input type="checkbox" id="set-missing-fonts" ${state.settings.detectMissingFonts ? 'checked' : ''}>
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-section-header">
            <span>Effects & Layer Scope</span>
          </div>
          <div class="setting-row">
            <div class="setting-left">
              <div class="setting-name">Missing Effect Styles</div>
              <div class="setting-desc">Detect unlinked or remote shadow and blur effect styles</div>
            </div>
            <label class="switch">
              <input type="checkbox" id="set-effects" ${state.settings.detectEffects ? 'checked' : ''}>
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <div class="setting-left">
              <div class="setting-name">Scan Hidden Layers</div>
              <div class="setting-desc">Include invisible or hidden layers during document scans</div>
            </div>
            <label class="switch">
              <input type="checkbox" id="set-hidden" ${state.settings.scanHiddenLayers ? 'checked' : ''}>
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="settings-footer-actions">
          <button id="btn-reset-settings" class="btn-reset-settings">Reset to Defaults</button>
        </div>
      `;

      // Wire checkboxes
      const bindToggle = (elemId, key) => {
        const checkbox = panel.querySelector('#' + elemId);
        if (checkbox) {
          checkbox.addEventListener('change', () => {
            state.settings[key] = checkbox.checked;
            saveSettings();
          });
        }
      };

      bindToggle('set-shape-colors', 'detectShapeColors');
      bindToggle('set-text-colors', 'detectTextColors');
      bindToggle('set-fills', 'detectFills');
      bindToggle('set-strokes', 'detectStrokes');
      bindToggle('set-variables', 'detectVariables');
      bindToggle('set-text-styles', 'detectTextStyles');
      bindToggle('set-missing-fonts', 'detectMissingFonts');
      bindToggle('set-effects', 'detectEffects');
      bindToggle('set-hidden', 'scanHiddenLayers');

      const resetBtn = panel.querySelector('#btn-reset-settings');
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          state.settings = {
            detectShapeColors: true,
            detectTextColors: true,
            detectFills: true,
            detectStrokes: true,
            detectVariables: true,
            detectTextStyles: true,
            detectMissingFonts: true,
            detectEffects: true,
            scanHiddenLayers: true
          };
          saveSettings();
          renderSettings();
        });
      }

      const backBtn = panel.querySelector('#btn-back-to-scan');
      if (backBtn) {
        backBtn.addEventListener('click', () => {
          state.currentTab = 'all';
          render();
        });
      }

      contentList.appendChild(panel);
    }

    function saveSettings() {
      try {
        localStorage.setItem('mlf_settings', JSON.stringify({
          settings: state.settings,
          scope: state.scope
        }));
      } catch (e) {}

      if (state.hasScanned) {
        loadingOverlay.classList.add('active');
        loadingStatus.textContent = 'Updating scan with new settings...';
        parent.postMessage({
          pluginMessage: {
            type: 'save-settings',
            scope: state.scope,
            settings: state.settings,
            scan: true
          }
        }, '*');
      } else {
        parent.postMessage({
          pluginMessage: {
            type: 'save-settings',
            scope: state.scope,
            settings: state.settings,
            scan: false
          }
        }, '*');
      }
    }

    function renderInitialEmptyState() {
      const wrapper = document.createElement('div');
      wrapper.className = 'initial-empty-wrapper';
      wrapper.innerHTML = `
        <div class="initial-empty-card">
          <div class="initial-empty-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
              <circle cx="11" cy="11" r="4"/>
              <line x1="21" y1="21" x2="14" y2="14"/>
            </svg>
          </div>
          
          <div class="initial-empty-title">Find Missing Libraries</div>
          <div class="initial-empty-desc">
            Scan your Figma document to find unlinked color styles, remote variables, and missing fonts.
          </div>

          <div class="initial-scope-container">
            <span class="initial-scope-label">Scan Scope</span>
            <div class="initial-scope-selector">
              <button class="initial-scope-btn ${state.scope === 'all' ? 'active' : ''}" data-scope="all">All Pages</button>
              <button class="initial-scope-btn ${state.scope === 'current' ? 'active' : ''}" data-scope="current">Current Page</button>
            </div>
          </div>

          <button id="btn-start-scan" class="btn-primary-start-scan">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
            <span>Start Scan</span>
          </button>

          <button id="btn-open-settings" class="btn-settings-link">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            <span>Detection Settings</span>
          </button>
        </div>
      `;
      contentList.appendChild(wrapper);

      // Wire scope buttons inside the card
      wrapper.querySelectorAll('.initial-scope-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          setScope(btn.dataset.scope);
        });
      });

      // Wire start scan button
      const startBtn = wrapper.querySelector('#btn-start-scan');
      if (startBtn) {
        startBtn.addEventListener('click', () => {
          triggerScan();
        });
      }

      // Wire settings button
      const settingsBtn = wrapper.querySelector('#btn-open-settings');
      if (settingsBtn) {
        settingsBtn.addEventListener('click', () => {
          state.currentTab = 'settings';
          render();
        });
      }
    }

    function renderEmptyState() {
      const isFiltered = !!state.searchQuery;
      const emptyDiv = document.createElement('div');
      emptyDiv.className = 'empty-state';
      const iconSvg = isFiltered
