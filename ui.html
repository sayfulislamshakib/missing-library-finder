        ? `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16" y2="16"/></svg>`
        : `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`;

      emptyDiv.innerHTML = `
        <div class="empty-icon">${iconSvg}</div>
        <div class="empty-title">${isFiltered ? 'No matching items' : 'No Missing Libraries Found!'}</div>
        <div class="empty-desc">
          ${isFiltered 
            ? 'Try adjusting your search terms or <a href="#" id="link-clear-search" style="color:var(--primary);text-decoration:none;font-weight:500;">clear search</a>.' 
            : `All styles on ${state.scope === 'all' ? 'all pages' : 'this page'} are linked and available.`}
        </div>
      `;
      contentList.appendChild(emptyDiv);

      if (isFiltered) {
        const linkClear = emptyDiv.querySelector('#link-clear-search');
        if (linkClear) {
          linkClear.addEventListener('click', (e) => {
            e.preventDefault();
            clearSearch();
          });
        }
      }
    }

    function renderDrawerRows(drawer, item, card, maxToRender = 50) {
      if (!drawer || !item || !item.nodes) return;
      const total = item.nodes.length;
      if (total === 0) {
        drawer.innerHTML = '<div style="padding: 8px 12px; font-size: 11px; color: var(--text-muted);">No layers remaining</div>';
        drawer.dataset.renderedCount = '0';
        return;
      }

      const count = Math.min(total, maxToRender);
      let html = '';
      for (let i = 0; i < count; i++) {
        const node = item.nodes[i];
        const safeName = (node.name || 'Unnamed Layer').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        const safePage = (node.pageName || 'Page').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        html += `
          <div class="layer-row" data-node-id="${node.id}">
            <div class="layer-meta">
              <span class="layer-type-tag">${node.type || 'LAYER'}</span>
              <span class="layer-name" title="${safeName}">${safeName}</span>
              <span class="layer-page-pill">${safePage}</span>
            </div>
            <div class="layer-actions">
              <button class="layer-btn focus-layer" data-node-id="${node.id}" data-page-id="${node.pageId || ''}" title="Focus layer">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
              <button class="layer-btn break-single" data-node-id="${node.id}" title="Detach this layer only">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="6" cy="6" r="3"/>
                  <circle cx="6" cy="18" r="3"/>
                  <line x1="20" y1="4" x2="8.12" y2="15.88"/>
                  <line x1="14.47" y1="14.48" x2="20" y2="20"/>
                  <line x1="8.12" y1="8.12" x2="12" y2="12"/>
                </svg>
              </button>
            </div>
          </div>
        `;
      }

      if (count < total) {
        html += `
          <div class="drawer-pagination-row" style="display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; font-size: 11px; border-top: 1px solid var(--border-subtle); color: var(--text-dim); background: var(--bg-hover);">
            <span>Showing ${count.toLocaleString()} of ${total.toLocaleString()} layers</span>
            <div style="display: flex; gap: 6px;">
              <button type="button" class="btn-load-more-layers" data-rendered-count="${count}" style="padding: 2px 8px; font-size: 10px; font-weight: 500; border-radius: 4px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer;">+50 More</button>
              <button type="button" class="btn-load-all-layers" style="padding: 2px 8px; font-size: 10px; font-weight: 500; border-radius: 4px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer;">Show All (${total.toLocaleString()})</button>
            </div>
          </div>
        `;
      }

      drawer.innerHTML = html;
      drawer.dataset.renderedCount = String(count);
    }

    function createItemCard(item) {
      const card = document.createElement('div');
      card.className = 'item-card';
      const isExpanded = state.expandedCards.has(item.key);
      if (isExpanded) card.classList.add('expanded');

      // Visual Swatch or Font icon
      let iconHtml = '';
      if (item.category === 'color') {
        iconHtml = `<div class="swatch" style="background-color: ${item.previewColor || '#ccc'};" title="${item.previewColor || ''}"></div>`;
      } else if (item.category === 'font') {
        iconHtml = `<div class="font-icon-badge" title="Missing Font">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 7 4 4 20 4 20 7"/>
            <line x1="9" y1="20" x2="15" y2="20"/>
            <line x1="12" y1="4" x2="12" y2="20"/>
          </svg>
        </div>`;
      } else {
        iconHtml = `<div class="font-icon-badge" title="Effect Style">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 3v18"/>
            <path d="M12 8l4 4-4 4"/>
          </svg>
        </div>`;
      }

      // Subtype label
      let pillClass = 'fill';
      let pillLabel = 'Fill Style';
      if (item.subType === 'stroke-style') {
        pillClass = 'stroke';
        pillLabel = 'Stroke Style';
      } else if (item.subType === 'variable') {
        pillClass = 'variable';
        pillLabel = 'Variable';
      } else if (item.subType === 'text-style') {
        pillClass = 'text-style';
        pillLabel = 'Text Style';
      } else if (item.subType === 'missing-font') {
        pillClass = 'font';
        pillLabel = 'Missing Font';
      }

      const layerCount = item.nodes ? item.nodes.length : 0;
      const firstNode = item.nodes && item.nodes.length > 0 ? item.nodes[0] : null;
      let displayName = item.name || '';
      if (!displayName || displayName.startsWith('Remote Style (') || displayName.startsWith('Remote Variable (')) {
        if (item.category === 'color' && item.previewColor) {
          displayName = `Remote Color (${item.previewColor})`;
        } else if (item.category === 'font') {
          displayName = item.fontFamily || 'Remote Text Style';
        } else if (item.category === 'effect') {
          displayName = 'Remote Effect Style';
        } else {
          displayName = 'Missing Library Style';
        }
      }

      card.innerHTML = `
        <div class="item-header">
          <div class="item-left">
            ${iconHtml}
            <div class="item-info">
              <div class="item-title" title="${displayName}">${displayName}</div>
              <div class="item-badge-row">
                <span class="type-pill ${pillClass}">${pillLabel}</span>
                <span class="layer-count-tag">${layerCount} layer${layerCount === 1 ? '' : 's'}</span>
              </div>
            </div>
          </div>
          <div class="item-actions">
            <button class="btn-action focus" title="Focus first affected layer">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
            <button class="btn-action select-all" title="Select all affected layers on canvas">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="6"/>
                <circle cx="12" cy="12" r="2"/>
              </svg>
            </button>
            <button class="btn-action break" title="Break / detach this missing style">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="6" cy="6" r="3"/>
                <circle cx="6" cy="18" r="3"/>
                <line x1="20" y1="4" x2="8.12" y2="15.88"/>
                <line x1="14.47" y1="14.48" x2="20" y2="20"/>
                <line x1="8.12" y1="8.12" x2="12" y2="12"/>
              </svg>
            </button>
            <div class="toggle-drawer-icon" title="View affected layers">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </div>
          </div>
        </div>
        <div class="layers-drawer"></div>
      `;

      const drawer = card.querySelector('.layers-drawer');

      // Header click expands/collapses
      const headerEl = card.querySelector('.item-header');
      headerEl.addEventListener('click', (e) => {
        if (e.target.closest('.btn-action')) return;
        const willExpand = !card.classList.contains('expanded');
        card.classList.toggle('expanded', willExpand);
        if (willExpand) {
          state.expandedCards.add(item.key);
          if (!drawer.dataset.renderedCount) {
            renderDrawerRows(drawer, item, card, 50);
          }
        } else {
          state.expandedCards.delete(item.key);
        }
      });

      // Focus button (focuses first node)
      const focusBtn = card.querySelector('.btn-action.focus');
      focusBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (firstNode) {
          parent.postMessage({
            pluginMessage: {
              type: 'focus-node',
              nodeId: firstNode.id,
              pageId: firstNode.pageId
            }
          }, '*');
        }
      });

      // Select All button
      const selectBtn = card.querySelector('.btn-action.select-all');
      selectBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (item.nodes && item.nodes.length > 0) {
          parent.postMessage({
            pluginMessage: {
              type: 'select-nodes',
              nodeIds: item.nodes.map(n => n.id),
              pageId: firstNode ? firstNode.pageId : null
            }
          }, '*');
        }
      });

      // Break item button
      const breakBtn = card.querySelector('.btn-action.break');
      breakBtn.addEventListener('click', (e) => {
        e.stopPropagation();

        parent.postMessage({
          pluginMessage: {
            type: 'break-item',
            itemKey: item.key,
            subType: item.subType,
            rawId: item.rawId,
            nodeIds: item.nodes ? item.nodes.map(n => n.id) : [],
            replacementFont: state.selectedFont,
            scope: state.scope
          }
        }, '*');

        // Optimistic removal: instantly removes card from state & UI without blocking re-scan
        removeItemFromState(item.key);
      });

      // Drawer event delegation (1 listener handles focus, single detach, and pagination for all rows)
      drawer.addEventListener('click', (e) => {
        const rowFocusBtn = e.target.closest('.focus-layer');
        if (rowFocusBtn) {
          e.stopPropagation();
          const nodeId = rowFocusBtn.getAttribute('data-node-id');
          const pageId = rowFocusBtn.getAttribute('data-page-id');
          if (nodeId) {
            parent.postMessage({
              pluginMessage: {
                type: 'focus-node',
                nodeId,
                pageId
              }
            }, '*');
          }
          return;
        }

        const rowBreakBtn = e.target.closest('.break-single');
        if (rowBreakBtn) {
          e.stopPropagation();
          const nodeId = rowBreakBtn.getAttribute('data-node-id');
          const row = rowBreakBtn.closest('.layer-row');
          if (nodeId) {
            parent.postMessage({
              pluginMessage: {
                type: 'break-item',
                itemKey: item.key,
                subType: item.subType,
                rawId: item.rawId,
                nodeIds: [nodeId],
                replacementFont: state.selectedFont,
                scope: state.scope
              }
            }, '*');
            removeLayerFromItem(item.key, nodeId, card, row);
          }
          return;
        }

        const loadMoreBtn = e.target.closest('.btn-load-more-layers');
        if (loadMoreBtn) {
          e.stopPropagation();
          const currentCount = parseInt(loadMoreBtn.getAttribute('data-rendered-count') || '50', 10);
          renderDrawerRows(drawer, item, card, currentCount + 50);
          return;
        }

        const loadAllBtn = e.target.closest('.btn-load-all-layers');
        if (loadAllBtn) {
          e.stopPropagation();
          renderDrawerRows(drawer, item, card, item.nodes ? item.nodes.length : 0);
          return;
        }
      });

      // If initially expanded, render initial 50 rows
      if (isExpanded) {
        renderDrawerRows(drawer, item, card, 50);
      }

      return card;
    }

    // Initial render - display initial empty state
    render();
    updateStats();
  </script>
</body>
</html>
